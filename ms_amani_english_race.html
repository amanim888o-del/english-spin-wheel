<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ms. Amani's English Race</title>
<style>
:root{--p:#6246d8;--pink:#ff69a8;--gold:#ffd65a;--ink:#30264e}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#d9f5ff,#fbe2f1 52%,#fff0bf)}.wrap{max-width:950px;margin:auto;padding:15px}.head{text-align:center;padding:12px}.brand{display:inline-block;background:white;border:3px solid var(--gold);border-radius:30px;padding:7px 17px;font-weight:1000;letter-spacing:1px;color:var(--p)}h1{font-size:clamp(2rem,7vw,3.8rem);line-height:1.05;color:#5136c8;text-shadow:2px 3px white;margin:12px 0 5px}.sub{font-weight:700;color:#675e84}.panel{background:#ffffffed;border:3px solid white;border-radius:25px;padding:clamp(15px,4vw,26px);box-shadow:0 12px 30px #5945a522;margin:15px 0}.center{text-align:center}input{font:inherit;padding:14px;border:2px solid #d8ceff;border-radius:14px;width:min(100%,360px);margin:8px}button{font:inherit;font-weight:900;border:0;border-radius:15px;padding:13px 18px;cursor:pointer;transition:transform .12s}button:active{transform:translateY(3px)}.primary{background:var(--p);color:white;box-shadow:0 5px 0 #4230a0}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.level{background:#f2edff;color:#543e93;border:3px solid transparent;box-shadow:none;min-height:95px}.level b{display:block;font-size:1.1rem}.level span{font-size:.82rem}.level.active{border-color:var(--pink);background:#fff0f6}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:900}.pill{background:#f0ecff;padding:8px 12px;border-radius:12px}.progress{height:13px;background:#eee9ff;border-radius:20px;overflow:hidden;margin:13px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff70ae,#ffcf4d,#5edcba);transition:width .3s}.race{height:155px;position:relative;overflow:hidden;border:3px solid white;border-radius:20px;background:linear-gradient(#9ee7ff 0 58%,#7bdb93 58% 68%,#656b80 68%);margin:14px 0}.cloud{position:absolute;top:18px;left:12%;font-size:35px}.sun{position:absolute;right:8%;top:10px;font-size:38px}.road{position:absolute;bottom:0;left:0;right:0;height:50px;background:#565a70;border-top:5px solid white}.dash{position:absolute;top:22px;left:0;right:0;border-top:4px dashed white}.cars{position:absolute;left:4%;right:4%;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-size:42px;z-index:2}.playercar{display:inline-block;transition:transform .4s}.qarea{text-align:center}.category{font-weight:1000;letter-spacing:1px;color:#9560bf}.qtext{font-size:clamp(1.25rem,4vw,1.8rem);font-weight:950;margin:12px 0 17px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:690px;margin:auto}.answer{background:#f4efff;color:#4f3a85;border:2px solid #dfd5ff;box-shadow:0 4px 0 #d2c4f4;min-height:56px}.answer:disabled{opacity:1}.answer.good{background:#c9f6dd;border-color:#55c58b}.answer.bad{background:#ffd9df;border-color:#ef8799}.feedback{min-height:32px;font-weight:900;margin:14px 0;color:#6a48b6}.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.finish{text-align:center}.trophy{font-size:clamp(4rem,16vw,7rem);animation:bounce .8s infinite alternate}@keyframes bounce{to{transform:translateY(-9px) rotate(4deg)}}.sound{position:fixed;right:12px;top:12px;z-index:4;background:white;border:2px solid #d8ceff;border-radius:99px;padding:9px 13px;font-weight:900}footer{text-align:center;color:#76678f;font-weight:800;padding:10px}@media(max-width:580px){.wrap{padding:10px}.levels{grid-template-columns:1fr}.level{min-height:65px}.answers{grid-template-columns:1fr}}
</style></head><body>
<button class="sound" id="soundBtn">🔊 Sound ON</button><main class="wrap">
<header class="head"><div class="brand">MS. AMANI'S ENGLISH GAMES</div><h1>🏁 ENGLISH RACE 🏎️</h1><div class="sub">Choose your level. Answer. Race to the finish!</div></header>
<section class="panel center" id="start"><div style="font-size:2.8rem">🚦 🏎️ 🏁</div><h2>Welcome, Racer!</h2><label for="player">What's your name?</label><br><input id="player" maxlength="24" placeholder="Enter your name"><h3>Choose your English level</h3>
<div class="levels"><button class="level active" data-level="easy"><b>🌱 Easy for Kids</b><span>Simple words & sentences</span></button><button class="level" data-level="medium"><b>⭐ Medium</b><span>Grammar & vocabulary</span></button><button class="level" data-level="advanced"><b>🚀 Advanced</b><span>Tricky English challenges</span></button></div><button class="primary" id="startBtn">START THE RACE!</button><p style="font-size:.88rem;color:#786b91">10 questions • 10 points for each correct answer • One player</p></section>
<section class="panel hidden" id="game"><div class="top"><span id="welcome"></span><span class="pill">⭐ Score: <b id="score">0</b></span><span class="pill">🏁 <b id="num">1</b>/10</span></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="race"><div class="cloud">☁️</div><div class="sun">☀️</div><div class="cars"><span class="playercar" id="car">🏎️</span><span>🏁</span></div><div class="road"><div class="dash"></div></div></div>
<div class="qarea"><div class="category" id="category"></div><div class="qtext" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="row"><button class="primary hidden" id="nextBtn">NEXT QUESTION →</button></div></div></section>
<section class="panel finish hidden" id="finish"><div class="trophy">🏆</div><h2 id="finishTitle"></h2><p id="result"></p><div style="font-size:2.4rem">🎉 ⭐ 🏁 ⭐ 🎉</div><button class="primary" onclick="location.reload()">RACE AGAIN</button></section><footer>Made with care by Ms. Amani</footer></main>
<script>
const bank={
easy:[
["VOCABULARY","Which one is a fruit?",["Apple","Chair","Pencil","Shoe"],0],["COLORS","What color is the sky on a sunny day?",["Green","Blue","Pink","Black"],1],["GRAMMAR","I ___ a student.",["am","is","are","be"],0],["ANIMALS","Which animal says “meow”?",["Dog","Cow","Cat","Duck"],2],["PLURALS","One book, two ___.",["book","books","bookes","booking"],1],["OPPOSITES","What is the opposite of “big”?",["Small","Tall","Long","Happy"],0],["ARTICLES","I see ___ elephant.",["a","an","thee","am"],1],["VERBS","Birds can ___.",["swim in space","fly","read books","drive"],1],["PREPOSITIONS","The shoes are ___ the bed.",["under","yesterday","quickly","happy"],0],["SPELLING","Choose the correct spelling.",["Frend","Freind","Friend","Freiend"],2]],
medium:[
["GRAMMAR","She ___ to school every day.",["go","goes","going","gone"],1],["TENSES","Yesterday, we ___ a movie.",["watch","watched","watches","watching"],1],["VOCABULARY","A person who helps sick people is a ___.",["pilot","doctor","farmer","chef"],1],["COMPARATIVES","A giraffe is ___ than a rabbit.",["tall","taller","tallest","more tall"],1],["PREPOSITIONS","The meeting starts ___ 9 o’clock.",["in","on","at","by"],2],["PRONOUNS","Sara is my friend. ___ is kind.",["He","They","It","She"],3],["COUNTABLE NOUNS","How ___ apples do you need?",["much","many","any","a little"],1],["SPELLING","Choose the correct spelling.",["Beautiful","Beautifull","Beutiful","Beautifal"],0],["FUTURE","Look at those clouds! It ___ rain.",["is going to","went to","has","was"],0],["WORD MEANING","“Enormous” means ___.",["tiny","very big","very quiet","very slow"],1]],
advanced:[
["CONDITIONALS","If I ___ more time, I would learn French.",["have","had","will have","has"],1],["PASSIVE VOICE","Choose the passive sentence.",["The chef cooked dinner.","Dinner was cooked by the chef.","The chef cooks dinner.","The chef is cooking."],1],["VOCABULARY","What does “reluctant” mean?",["Unwilling","Delighted","Careless","Certain"],0],["SUBJECT-VERB AGREEMENT","Neither of the answers ___ correct.",["are","were","is","be"],2],["REPORTED SPEECH","She said, “I am tired.” → She said she ___ tired.",["is","was","will be","has"],1],["WORD FORMATION","What is the noun form of “decide”?",["decisive","decision","deciding","decided"],1],["GRAMMAR","Despite ___ late, he finished the task.",["be","being","was","been"],1],["QUANTIFIERS","Choose the correct phrase.",["fewer water","less water","few water","many water"],1],["VOCABULARY","“Ancient” is closest in meaning to ___.",["modern","very old","expensive","unusual"],1],["FUTURE PERFECT","By next June, I ___ my course.",["finish","finished","will have finished","am finish"],2]]};
let level="easy",questions=[],index=0,score=0,locked=false,soundOn=true,ctx=null,playerName="";
const $=id=>document.getElementById(id);
document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));b.classList.add("active");level=b.dataset.level;sfx("tap")}));
function audio(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}catch(e){return null}}
function tone(freq,dur=.16,type="sine",vol=.07,delay=0){if(!soundOn)return;const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+delay);g.gain.setValueAtTime(.001,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(vol,c.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur+.02)}
function sfx(k){if(!soundOn)return;if(k==="tap")tone(600,.08);if(k==="start")[440,554,659,880].forEach((f,i)=>tone(f,.2,"triangle",.07,i*.12));if(k==="correct")[523,659,784].forEach((f,i)=>tone(f,.19,"sine",.09,i*.1));if(k==="wrong"){tone(220,.25,"sawtooth",.045);tone(175,.28,"sawtooth",.04,.17)}if(k==="car"){tone(330,.1,"square",.035);tone(490,.14,"square",.035,.1)}if(k==="win")[523,659,784,1047,1318].forEach((f,i)=>tone(f,.28,"triangle",.09,i*.14))}
function start(){playerName=$("player").value.trim()||"Racer";questions=bank[level];index=0;score=0;audio();sfx("start");$("start").classList.add("hidden");$("game").classList.remove("hidden");$("welcome").textContent="Good luck, "+playerName+"!";$("score").textContent=0;showQ()}
function showQ(){locked=false;let q=questions[index];$("num").textContent=index+1;$("bar").style.width=index*10+"%";$("category").textContent=q[0];$("question").textContent=q[1];$("feedback").textContent="Choose the best answer!";$("nextBtn").classList.add("hidden");$("answers").innerHTML="";q[2].forEach((a,i)=>{let b=document.createElement("button");b.className="answer";b.textContent=String.fromCharCode(65+i)+". "+a;b.onclick=()=>answer(i,b);$("answers").appendChild(b)})}
function answer(choice,btn){if(locked)return;let q=questions[index],bs=[...$("answers").children];if(choice===q[3]){locked=true;score+=10;$("score").textContent=score;btn.classList.add("good");$("feedback").textContent="BRILLIANT! Correct answer! +10 points";bs.forEach(b=>b.disabled=true);sfx("correct");sfx("car");$("car").style.transform="translateX("+Math.min(65,index*6)+"px)";$("bar").style.width=(index+1)*10+"%";$("nextBtn").classList.remove("hidden");$("nextBtn").textContent=index===9?"CROSS THE FINISH LINE!":"NEXT QUESTION →"}else{btn.classList.add("bad");btn.disabled=true;$("feedback").textContent="Not quite! Try another answer.";sfx("wrong")}}
function next(){index++;if(index<10){$("car").style.transform="";showQ()}else finish()}
function finish(){$("game").classList.add("hidden");$("finish").classList.remove("hidden");$("finishTitle").textContent=score>=80?"🏆 AMAZING, "+playerName.toUpperCase()+"!":"GREAT RACE, "+playerName.toUpperCase()+"!";$("result").textContent="You scored "+score+" out of 100. You are an English Race star!";sfx("win")}
$("startBtn").addEventListener("click",start);$("nextBtn").addEventListener("click",next);$("soundBtn").addEventListener("click",()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";if(soundOn){audio();sfx("correct")}});
</script></body></html>
